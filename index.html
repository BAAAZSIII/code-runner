<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kód Futtató, Mentő és Teljes Képernyő</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { display: flex; gap: 20px; }
        .editor-section { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .saves-section { width: 250px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; font-family: monospace; padding: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-group { display: flex; gap: 10px; }
        .save-item { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; }
        .save-item:hover { background: #ddd; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
        .delete-btn:hover { background: #bd2130; }
        
        /* Megjelenítési terület és gombok wrapperje */
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        #output-container { border: 2px dashed #ccc; background: #fff; border-radius: 8px; position: relative; width: 100%; height: 400px; }
        #preview-iframe { width: 100%; height: 100%; border: none; border-radius: 6px; }

        /* Teljes képernyős stílus, ha be van kapcsolva */
        #output-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border: none;
            border-radius: 0;
        }
        /* Teljes képernyő gomb elhelyezése */
        .fullscreen-btn { background: #6c757d; font-size: 14px; padding: 6px 12px; }
        .fullscreen-btn.active { background: #dc3545; }
    </style>
</head>
<body>

    <h1>Kód Futtató és Mentő</h1>
    
    <div class="container">
        <!-- Szerkesztő rész -->
        <div class="editor-section">
            <label for="codeTitle">Mentési név (ha el akarod menteni):</label>
            <input type="text" id="codeTitle" placeholder="Pl: YouTube videóm">
            
            <label for="codeInput">Illeszd be a kódot (Enter-re vagy a Submit-ra indul):</label>
            <textarea id="codeInput" placeholder="Ide jön a HTML / YouTube beágyazó kód..."></textarea>
            
            <div class="btn-group">
                <button id="submitBtn" onclick="runCode()">Submit (Futtatás)</button>
                <button id="saveBtn" onclick="saveCode()" style="background: #28a745;">Mentés</button>
            </div>
        </div>

        <!-- Mentések listája -->
        <div class="saves-section">
            <h3>Mentett kódjaid</h3>
            <div id="savesList">Nincs még mentett kód.</div>
        </div>
    </div>

    <!-- Eredmény fejléc gombbal -->
    <div class="output-header">
        <h3>Eredmény / Megjelenítés:</h3>
        <button id="resizeBtn" class="fullscreen-btn" onclick="toggleFullscreen()" style="display: none;">🖥️ Teljes képernyő</button>
    </div>
    
    <!-- Az ablak, amiben a kód fut és amit nagyítani lehet -->
    <div id="output-container">
        <iframe id="preview-iframe"></iframe>
    </div>

    <script>
        const codeInput = document.getElementById('codeInput');
        const codeTitle = document.getElementById('codeTitle');
        const outputContainer = document.getElementById('output-container');
        const previewIframe = document.getElementById('preview-iframe');
        const savesList = document.getElementById('savesList');
        const resizeBtn = document.getElementById('resizeBtn');

        // 1. Futtatás ENTER leütésére
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                runCode();
            }
        });

        // Kód futtatása funkció
        function runCode() {
            const code = codeInput.value;
            if(!code.trim()) return;

            const doc = previewIframe.contentDocument || previewIframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();

            // Ha van futó kód, megjelenítjük a nagyítás gombot
            resizeBtn.style.display = 'block';
        }

        // Kinyitás és összecsukás funkció (Teljes képernyő)
        function toggleFullscreen() {
            outputContainer.classList.toggle('fullscreen');
            
            if (outputContainer.classList.contains('fullscreen')) {
                resizeBtn.innerHTML = '❌ Kicsinyítés (Bezárás)';
                resizeBtn.classList.add('active');
                // Áttesszük a gombot ideiglenesen a teljes képernyős ablakba, hogy ott is látszódjon felül
                resizeBtn.style.position = 'fixed';
                resizeBtn.style.top = '10px';
                resizeBtn.style.right = '10px';
                resizeBtn.style.zIndex = '10000';
            } else {
                resizeBtn.innerHTML = '🖥️ Teljes képernyő';
                resizeBtn.classList.remove('active');
                resizeBtn.style.position = 'static';
            }
        }

        // ESC billentyű figyelése a kicsinyítéshez
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && outputContainer.classList.contains('fullscreen')) {
                toggleFullscreen();
            }
        });

        // Kód mentése LocalStorage-ba
        function saveCode() {
            const title = codeTitle.value.trim();
            const code = codeInput.value.trim();

            if (!title || !code) {
                alert('Kérlek adj meg egy nevet és töltsd ki a kód mezőt is!');
                return;
            }

            let saves = JSON.parse(localStorage.getItem('html_saves')) || {};
            saves[title] = code;
            localStorage.setItem('html_saves', JSON.stringify(saves));
            
            codeTitle.value = '';
            loadSavesList();
        }

        // Mentések betöltése és listázása
        function loadSavesList() {
            let saves = JSON.parse(localStorage.getItem('html_saves')) || {};
            savesList.innerHTML = '';

            if (Object.keys(saves).length === 0) {
                savesList.innerHTML = 'Nincs még mentett kód.';
                return;
            }

            for (let title in saves) {
                const div = document.createElement('div');
                div.className = 'save-item';
                div.innerHTML = `
                    <span onclick="loadCode('${title}')" style="flex:1; font-weight:bold;">${title}</span>
                    <button class="delete-btn" onclick="deleteCode(event, '${title}')">X</button>
                `;
                savesList.appendChild(div);
            }
        }

        // Egy mentés betöltése
        function loadCode(title) {
            let saves = JSON.parse(localStorage.getItem('html_saves')) || {};
            if (saves[title]) {
                codeInput.value = saves[title];
                codeTitle.value = title;
            }
        }

        // Mentés törlése
        function deleteCode(event, title) {
            event.stopPropagation();
            if (confirm(`Biztosan törlöd a(z) "${title}" mentést?`)) {
                let saves = JSON.parse(localStorage.getItem('html_saves')) || {};
                delete saves[title];
                localStorage.setItem('html_saves', JSON.stringify(saves));
                loadSavesList();
            }
        }

        loadSavesList();
    </script>
</body>
</html>
